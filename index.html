<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explorations · Thrive</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" />
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #fff;
      --ink: #14161a;
      --muted: #5f6672;
      --line: #e3e6eb;
      --brand: #1f5eff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 400 15px/1.5 "General Sans", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 880px; margin: 0 auto; padding: 72px 24px 96px; }
    header { margin-bottom: 40px; }
    .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 500; font-size: 13px; letter-spacing: .02em; }
    .eyebrow img { height: 18px; }
    h1 { margin: 12px 0 8px; font-size: 32px; font-weight: 600; letter-spacing: -.01em; }
    header p { margin: 0; color: var(--muted); }

    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); padding: 0; margin: 0; list-style: none; }
    .card {
      display: flex; flex-direction: column; gap: 8px; height: 100%;
      padding: 20px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--card); color: inherit; text-decoration: none;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .card:hover, .card:focus-visible { border-color: var(--brand); box-shadow: 0 6px 20px rgba(20, 22, 26, .06); transform: translateY(-1px); outline: none; }
    .card h2 { margin: 0; font-size: 17px; font-weight: 600; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .tag { padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
    .date { margin-left: auto; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow"><img src="explorations/molina-widget/assets/thrive-symbol.svg" alt="" />Thrive Mobile</div>
      <h1>Explorations</h1>
      <p>Prototypes and design experiments.</p>
    </header>
    <ul class="grid" id="list"></ul>
  </main>

  <script>
    // To add an exploration: create explorations/<slug>/index.html, then add an entry here.
    // Newest first.
    const EXPLORATIONS = [
      {
        slug: "molina-widget",
        title: "Molina widget",
        description: "Android home-screen widget for Molina members, with Flex Card balances and Care hub screens.",
        tags: ["Molina", "Widget", "Android"],
        date: "Nov 2026",
      },
    ];

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    document.getElementById("list").innerHTML = EXPLORATIONS.map((e) => `
      <li>
        <a class="card" href="explorations/${esc(e.slug)}/">
          <h2>${esc(e.title)}</h2>
          <p>${esc(e.description || "")}</p>
          <div class="meta">
            ${(e.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}
            ${e.date ? `<span class="date">${esc(e.date)}</span>` : ""}
          </div>
        </a>
      </li>`).join("");
  </script>
</body>
</html>
